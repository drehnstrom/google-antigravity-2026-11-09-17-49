<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-label="Three synchronized workspace panes connecting the Left Context Graph and Token Gauge to the Center Prompt Canvas and the Right Multi-File Diff Inspector">
  <defs>
    <linearGradient id="token-gauge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e71d6"/>
      <stop offset="0.6" stop-color="#6a55e4"/>
      <stop offset="1" stop-color="#bd35c2"/>
    </linearGradient>
    <marker id="pane-arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e71d6"/>
    </marker>
    <marker id="pane-arrow-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6a55e4"/>
    </marker>
  </defs>

  <!-- Outer App Window Frame -->
  <rect x="16" y="14" width="768" height="252" rx="10" fill="none" stroke="#082445" stroke-width="2.5"/>
  <rect x="16" y="14" width="768" height="30" rx="8" fill="#082445"/>
  <circle cx="34" cy="29" r="4.5" fill="#1e71d6"/>
  <circle cx="48" cy="29" r="4.5" fill="#6a55e4"/>
  <circle cx="62" cy="29" r="4.5" fill="#bd35c2"/>
  <text x="84" y="33" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">workspace: order-service (antigravity.yaml)</text>
  <text x="640" y="33" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">gemini-2.5-pro</text>

  <!-- Left Pane: Context Graph and Token Budget Gauge -->
  <rect x="28" y="54" width="216" height="200" rx="6" fill="none" stroke="#1e71d6" stroke-width="1.8"/>
  <text x="40" y="74" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">1. Context Graph</text>

  <!-- Pinned and AST nodes -->
  <rect x="40" y="86" width="192" height="26" rx="4" fill="#082445"/>
  <text x="50" y="103" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">[Pinned] src/orders/service.ts</text>

  <line x1="54" y1="112" x2="54" y2="132" stroke="#1e71d6" stroke-width="1.8"/>
  <line x1="54" y1="132" x2="68" y2="132" stroke="#1e71d6" stroke-width="1.8"/>
  <rect x="68" y="120" width="164" height="24" rx="4" fill="none" stroke="#1e71d6" stroke-width="1.5"/>
  <text x="76" y="136" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="10">[AST] src/models/order.ts</text>

  <line x1="54" y1="132" x2="54" y2="164" stroke="#1e71d6" stroke-width="1.8"/>
  <line x1="54" y1="164" x2="68" y2="164" stroke="#1e71d6" stroke-width="1.8"/>
  <rect x="68" y="152" width="164" height="24" rx="4" fill="none" stroke="#495f7a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="76" y="168" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="10">[Muted] src/legacy/v1.ts</text>

  <!-- Token Budget Bar -->
  <text x="40" y="206" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Token Budget: 8.4k / 32.0k</text>
  <rect x="40" y="214" width="192" height="12" rx="6" fill="none" stroke="#082445" stroke-width="1.5"/>
  <rect x="42" y="216" width="64" height="8" rx="4" fill="url(#token-gauge)"/>
  <text x="40" y="242" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="10">26% capacity used</text>

  <!-- Connector Left to Center -->
  <path d="M 244 148 L 266 148" fill="none" stroke="#1e71d6" stroke-width="2" marker-end="url(#pane-arrow-b)"/>

  <!-- Center Pane: Prompt Canvas and Execution Trace -->
  <rect x="272" y="54" width="236" height="200" rx="6" fill="none" stroke="#6a55e4" stroke-width="1.8"/>
  <text x="284" y="74" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">2. Prompt Canvas</text>

  <rect x="284" y="86" width="212" height="58" rx="4" fill="#082445"/>
  <text x="294" y="104" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Prompt + System Constraints</text>
  <text x="294" y="120" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" opacity="0.85">Add idempotency key validation</text>
  <text x="294" y="134" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="9">temp: 0.2 | verify: npm test</text>

  <!-- Execution Trace Timeline -->
  <text x="284" y="164" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Live Execution Trace</text>
  <rect x="284" y="172" width="212" height="22" rx="4" fill="#1e71d6" opacity="0.15"/>
  <text x="292" y="187" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="10">1. AST pruned (140 ms)</text>
  <rect x="284" y="198" width="212" height="22" rx="4" fill="#6a55e4" opacity="0.15"/>
  <text x="292" y="213" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="10">2. Gemini diff stream (1.9 s)</text>
  <rect x="284" y="224" width="212" height="22" rx="4" fill="#bd35c2" opacity="0.15"/>
  <text x="292" y="239" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="10">3. Sandbox test check: PASS</text>

  <!-- Connector Center to Right -->
  <path d="M 508 148 L 530 148" fill="none" stroke="#6a55e4" stroke-width="2" marker-end="url(#pane-arrow-p)"/>

  <!-- Right Pane: Multi-File Diff Inspector -->
  <rect x="536" y="54" width="236" height="200" rx="6" fill="none" stroke="#bd35c2" stroke-width="1.8"/>
  <text x="548" y="74" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">3. Multi-File Diff Inspector</text>

  <!-- File tabs -->
  <rect x="548" y="84" width="104" height="20" rx="3" fill="#082445"/>
  <text x="600" y="98" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600">service.ts (+14)</text>
  <rect x="656" y="84" width="104" height="20" rx="3" fill="none" stroke="#495f7a" stroke-width="1.2"/>
  <text x="708" y="98" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="9">service.test.ts (+28)</text>

  <!-- Diff Hunk Box -->
  <rect x="548" y="112" width="212" height="94" rx="4" fill="none" stroke="#082445" stroke-width="1.2"/>
  <rect x="556" y="120" width="196" height="20" rx="3" fill="#bd35c2" opacity="0.16"/>
  <text x="564" y="134" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">- await repo.save(order);</text>
  <rect x="556" y="146" width="196" height="20" rx="3" fill="#1e71d6" opacity="0.16"/>
  <text x="564" y="160" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">+ assertIdempotent(order.key);</text>
  <rect x="556" y="172" width="196" height="20" rx="3" fill="#1e71d6" opacity="0.16"/>
  <text x="564" y="186" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">+ await repo.save(order);</text>

  <!-- Action buttons -->
  <rect x="548" y="216" width="102" height="26" rx="4" fill="#1e71d6"/>
  <text x="599" y="233" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Accept Hunk</text>
  <rect x="658" y="216" width="102" height="26" rx="4" fill="none" stroke="#495f7a" stroke-width="1.5"/>
  <text x="709" y="233" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="10">Discard Hunk</text>
</svg>
