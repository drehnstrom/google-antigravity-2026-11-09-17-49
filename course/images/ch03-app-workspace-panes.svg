<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-label="Three synchronized workspace panes connecting the Left Context Graph and Token Gauge to the Center Prompt Canvas and the Right Multi-File Diff Inspector">
  <defs>
    <linearGradient id="token-gauge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e71d6"/>
      <stop offset="0.6" stop-color="#6a55e4"/>
      <stop offset="1" stop-color="#bd35c2"/>
    </linearGradient>
    <marker id="pane-arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e71d6"/>
    </marker>
    <marker id="pane-arrow-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6a55e4"/>
    </marker>
  </defs>

  <!-- Outer App Window Frame -->
  <rect x="16" y="14" width="768" height="252" rx="10" fill="none" stroke="#082445" stroke-width="2.5"/>
  <rect x="16" y="14" width="768" height="30" rx="8" fill="#082445"/>
  <circle cx="34" cy="29" r="4.5" fill="#1e71d6"/>
  <circle cx="48" cy="29" r="4.5" fill="#6a55e4"/>
  <circle cx="62" cy="29" r="4.5" fill="#bd35c2"/>
  <text x="84" y="33" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">workspace: order-service (antigravity.yaml)</text>
  <rect x="652" y="20" width="116" height="18" rx="4" fill="#1e71d6"/>
  <text x="710" y="33" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Sandbox: PASS</text>

  <!-- Left Pane: Context Graph Explorer and Token Budget Gauge -->
  <rect x="28" y="54" width="216" height="200" rx="6" fill="none" stroke="#1e71d6" stroke-width="1.8"/>
  <text x="40" y="72" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">1. Context Graph Explorer</text>

  <!-- Visual AST Node Graph -->
  <!-- Root Pinned Node -->
  <rect x="40" y="82" width="192" height="26" rx="13" fill="#082445"/>
  <circle cx="54" cy="95" r="4" fill="#1e71d6"/>
  <text x="66" y="99" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Pinned: src/orders/service.ts</text>

  <!-- Graph edges -->
  <path d="M 90 108 L 76 126" fill="none" stroke="#1e71d6" stroke-width="1.8"/>
  <path d="M 176 108 L 190 126" fill="none" stroke="#495f7a" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Child Node 1: AST Included -->
  <rect x="38" y="126" width="96" height="44" rx="6" fill="none" stroke="#1e71d6" stroke-width="1.8"/>
  <text x="86" y="144" text-anchor="middle" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">order.ts</text>
  <text x="86" y="160" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="9">AST (1.8k tok)</text>

  <!-- Child Node 2: Muted -->
  <rect x="142" y="126" width="92" height="44" rx="6" fill="none" stroke="#495f7a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="188" y="144" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="10">legacy.ts</text>
  <text x="188" y="160" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="9">Muted (-6.2k)</text>

  <!-- Token Budget Bar -->
  <text x="40" y="196" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Token Budget: 8.4k / 32.0k</text>
  <rect x="40" y="204" width="192" height="14" rx="7" fill="none" stroke="#082445" stroke-width="1.5"/>
  <rect x="42" y="206" width="56" height="10" rx="5" fill="url(#token-gauge)"/>
  <text x="40" y="236" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="10">26% used after muting legacy.ts</text>

  <!-- Connector Left to Center -->
  <path d="M 244 148 L 266 148" fill="none" stroke="#1e71d6" stroke-width="2" marker-end="url(#pane-arrow-b)"/>

  <!-- Center Pane: Prompt Canvas and Branch Execution Trace -->
  <rect x="272" y="54" width="236" height="200" rx="6" fill="none" stroke="#6a55e4" stroke-width="1.8"/>
  <text x="284" y="72" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">2. Prompt Canvas</text>

  <!-- Branch Selector Tabs -->
  <rect x="284" y="80" width="102" height="20" rx="4" fill="none" stroke="#495f7a" stroke-width="1.2"/>
  <text x="335" y="94" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="9">Branch A: flash</text>
  <rect x="392" y="80" width="104" height="20" rx="4" fill="#6a55e4"/>
  <text x="444" y="94" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600">Branch B: pro</text>

  <!-- Prompt Box -->
  <rect x="284" y="106" width="212" height="48" rx="4" fill="#082445"/>
  <text x="294" y="124" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Add idempotency key validation</text>
  <text x="294" y="142" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="9">temp: 0.2 | verify: npx vitest run</text>

  <!-- Execution Trace Timeline -->
  <text x="284" y="170" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Execution Trace</text>
  <rect x="284" y="176" width="212" height="20" rx="3" fill="#1e71d6" opacity="0.16"/>
  <text x="292" y="190" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="10">1. AST pruned (140 ms)</text>
  <rect x="284" y="200" width="212" height="20" rx="3" fill="#6a55e4" opacity="0.16"/>
  <text x="292" y="214" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="10">2. Gemini diff stream (1.9 s)</text>
  <rect x="284" y="224" width="212" height="20" rx="3" fill="#bd35c2" opacity="0.16"/>
  <text x="292" y="238" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="10">3. Sandbox vitest: 4 passed</text>

  <!-- Connector Center to Right -->
  <path d="M 508 148 L 530 148" fill="none" stroke="#6a55e4" stroke-width="2" marker-end="url(#pane-arrow-p)"/>

  <!-- Right Pane: Multi-File Diff Inspector -->
  <rect x="536" y="54" width="236" height="200" rx="6" fill="none" stroke="#bd35c2" stroke-width="1.8"/>
  <text x="548" y="72" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">3. Multi-File Diff Inspector</text>

  <!-- File tabs -->
  <rect x="548" y="80" width="104" height="20" rx="3" fill="#082445"/>
  <text x="600" y="94" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600">service.ts (+14)</text>
  <rect x="656" y="80" width="104" height="20" rx="3" fill="none" stroke="#495f7a" stroke-width="1.2"/>
  <text x="708" y="94" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="9">service.test.ts (+28)</text>

  <!-- Hunk 1 (Checked) -->
  <rect x="548" y="106" width="212" height="68" rx="4" fill="none" stroke="#1e71d6" stroke-width="1.5"/>
  <text x="556" y="120" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600">[x] Hunk 1: Idempotency guard</text>
  <rect x="556" y="126" width="196" height="18" rx="2" fill="#bd35c2" opacity="0.16"/>
  <text x="562" y="139" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600">- await repo.save(order);</text>
  <rect x="556" y="148" width="196" height="18" rx="2" fill="#1e71d6" opacity="0.16"/>
  <text x="562" y="161" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600">+ await saveIdempotent(order);</text>

  <!-- Hunk 2 (Unchecked) -->
  <rect x="548" y="180" width="212" height="28" rx="4" fill="none" stroke="#495f7a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="556" y="198" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="9">[ ] Hunk 2: Formatting change (skipped)</text>

  <!-- Action buttons -->
  <rect x="548" y="216" width="212" height="26" rx="4" fill="#1e71d6"/>
  <text x="654" y="233" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Apply Selected Hunks (1 of 2)</text>
</svg>
