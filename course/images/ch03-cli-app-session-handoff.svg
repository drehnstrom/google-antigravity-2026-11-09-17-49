<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 284" role="img" aria-label="CLI sessions saved in .antigravity/sessions open in the Antigravity App for side-by-side branch comparison and hunk selection, then export back as reusable CLI templates">
  <defs>
    <linearGradient id="session-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e71d6"/>
      <stop offset="0.5" stop-color="#6a55e4"/>
      <stop offset="1" stop-color="#bd35c2"/>
    </linearGradient>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e71d6"/>
    </marker>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6a55e4"/>
    </marker>
    <marker id="arrow-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#bd35c2"/>
    </marker>
  </defs>

  <!-- 1. Left: Terminal CLI and Shared Session Artifact -->
  <rect x="18" y="20" width="186" height="96" rx="8" fill="#082445"/>
  <circle cx="34" cy="36" r="4" fill="#1e71d6"/>
  <circle cx="46" cy="36" r="4" fill="#6a55e4"/>
  <circle cx="58" cy="36" r="4" fill="#bd35c2"/>
  <text x="32" y="62" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">$ ag edit src/auth.ts</text>
  <text x="32" y="80" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" opacity="0.9">--save-session s_409</text>
  <text x="32" y="100" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="10">$ ag app open --session s_409</text>

  <!-- Downward arrow to local state -->
  <path d="M 111 116 L 111 144" fill="none" stroke="#1e71d6" stroke-width="2" marker-end="url(#arrow-b)"/>

  <!-- Shared .antigravity/ directory -->
  <rect x="18" y="152" width="186" height="92" rx="8" fill="none" stroke="#082445" stroke-width="2"/>
  <text x="32" y="172" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">.antigravity/ workspace</text>
  <rect x="30" y="182" width="162" height="22" rx="4" fill="#1e71d6" opacity="0.16"/>
  <text x="38" y="197" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">sessions/s_409.json</text>
  <rect x="30" y="210" width="162" height="22" rx="4" fill="#bd35c2" opacity="0.16"/>
  <text x="38" y="225" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">templates/auth-guard.yaml</text>

  <!-- Arrow from session JSON into App Canvas -->
  <path d="M 204 193 L 256 132" fill="none" stroke="#1e71d6" stroke-width="2.5" marker-end="url(#arrow-b)"/>

  <!-- 2. Center: Antigravity App Interactive Branching and Hunk Selection -->
  <rect x="264" y="20" width="292" height="224" rx="10" fill="none" stroke="#082445" stroke-width="2.5"/>
  <rect x="264" y="20" width="292" height="30" rx="8" fill="url(#session-flow)"/>
  <text x="410" y="39" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Antigravity App Workspace (s_409)</text>

  <!-- Forked Prompt Branches -->
  <rect x="280" y="62" width="124" height="70" rx="6" fill="#082445"/>
  <text x="342" y="82" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Branch A: Flash</text>
  <text x="342" y="99" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10">0.8s | 3.1k tokens</text>
  <text x="342" y="116" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="10">1 file modified</text>

  <rect x="416" y="62" width="124" height="70" rx="6" fill="#082445"/>
  <text x="478" y="82" text-anchor="middle" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Branch B: Pro</text>
  <text x="478" y="99" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10">3.4s | 6.8k tokens</text>
  <text x="478" y="116" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10">3 files + edge tests</text>

  <!-- Merge into Hunk Inspector -->
  <path d="M 342 132 L 386 154" fill="none" stroke="#495f7a" stroke-width="1.5"/>
  <path d="M 478 132 L 434 154" fill="none" stroke="#bd35c2" stroke-width="2" marker-end="url(#arrow-m)"/>

  <rect x="280" y="158" width="260" height="72" rx="6" fill="none" stroke="#6a55e4" stroke-width="2"/>
  <text x="294" y="176" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Interactive Hunk Selector</text>
  <rect x="294" y="186" width="114" height="32" rx="4" fill="#1e71d6" opacity="0.18"/>
  <text x="351" y="206" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">[x] Hunk 1: JWT check</text>
  <rect x="416" y="186" width="110" height="32" rx="4" fill="#bd35c2" opacity="0.18"/>
  <text x="471" y="206" text-anchor="middle" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">[x] Hunk 2: Unit test</text>

  <!-- 3. Right: Outputs (Working Tree Patch + Template Export) -->
  <path d="M 556 100 L 606 78" fill="none" stroke="#6a55e4" stroke-width="2.5" marker-end="url(#arrow-p)"/>
  <path d="M 556 194 L 606 194" fill="none" stroke="#bd35c2" stroke-width="2.5" marker-end="url(#arrow-m)"/>

  <!-- Output 1: Applied Working Tree Diff -->
  <rect x="614" y="28" width="168" height="96" rx="8" fill="#082445"/>
  <text x="698" y="52" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Working Tree</text>
  <rect x="628" y="64" width="140" height="44" rx="4" fill="#1e71d6"/>
  <text x="698" y="83" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Approved Hunks</text>
  <text x="698" y="99" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" opacity="0.9">Verified with Vitest</text>

  <!-- Output 2: Exported Template back to CLI -->
  <rect x="614" y="148" width="168" height="96" rx="8" fill="#082445"/>
  <text x="698" y="172" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Exported Template</text>
  <rect x="628" y="184" width="140" height="44" rx="4" fill="#bd35c2"/>
  <text x="698" y="203" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">auth-guard.yaml</text>
  <text x="698" y="219" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" opacity="0.9">Reusable in CLI + CI</text>

  <!-- Clean return loop underneath the center workspace back to .antigravity/templates -->
  <path d="M 698 244 L 698 266 L 111 266 L 111 248" fill="none" stroke="#bd35c2" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-m)"/>
  <text x="410" y="278" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="10">ag generate --template auth-guard</text>
</svg>
