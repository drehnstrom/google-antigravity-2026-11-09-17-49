<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="CLI commands and App workspace events flow through the shared Antigravity engine and antigravity.yaml into Gemini models and return structured diffs to local files">
  <defs>
    <linearGradient id="ag-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e71d6"/>
      <stop offset="0.5" stop-color="#6a55e4"/>
      <stop offset="1" stop-color="#bd35c2"/>
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e71d6"/>
    </marker>
    <marker id="arrow-magenta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#bd35c2"/>
    </marker>
  </defs>

  <!-- Left: Dual Entry Surfaces (Terminal CLI and Graphical App) -->
  <!-- Terminal surface -->
  <rect x="24" y="24" width="180" height="106" rx="8" fill="#082445"/>
  <circle cx="40" cy="40" r="4" fill="#1e71d6"/>
  <circle cx="52" cy="40" r="4" fill="#6a55e4"/>
  <circle cx="64" cy="40" r="4" fill="#bd35c2"/>
  <text x="38" y="68" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">$ ag init --model</text>
  <text x="38" y="88" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" opacity="0.85">gemini-2.5-pro</text>
  <text x="38" y="112" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="11">Antigravity CLI</text>

  <!-- Graphical App surface -->
  <rect x="24" y="160" width="180" height="114" rx="8" fill="none" stroke="#082445" stroke-width="2"/>
  <rect x="24" y="160" width="180" height="24" rx="6" fill="#082445"/>
  <text x="36" y="176" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Antigravity App</text>
  <!-- Split panes inside App -->
  <rect x="36" y="194" width="70" height="66" rx="4" fill="none" stroke="#1e71d6" stroke-width="1.5"/>
  <line x1="42" y1="208" x2="96" y2="208" stroke="#1e71d6" stroke-width="2"/>
  <line x1="42" y1="220" x2="84" y2="220" stroke="#495f7a" stroke-width="2"/>
  <line x1="42" y1="232" x2="90" y2="232" stroke="#495f7a" stroke-width="2"/>
  <rect x="116" y="194" width="76" height="66" rx="4" fill="none" stroke="#6a55e4" stroke-width="1.5"/>
  <rect x="124" y="204" width="60" height="18" rx="3" fill="#6a55e4" opacity="0.2"/>
  <rect x="124" y="230" width="60" height="20" rx="3" fill="#bd35c2" opacity="0.2"/>

  <!-- Connectors to Local Shared Workspace and Engine -->
  <path d="M 204 77 L 278 118" fill="none" stroke="#1e71d6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M 204 217 L 278 176" fill="none" stroke="#1e71d6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Center: Local Antigravity Engine and Shared Workspace State -->
  <rect x="286" y="44" width="228" height="212" rx="10" fill="none" stroke="#082445" stroke-width="2.5"/>
  <rect x="304" y="62" width="192" height="44" rx="6" fill="url(#ag-flow)"/>
  <text x="400" y="89" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Antigravity Core Engine</text>

  <!-- Config and context artifacts inside workspace -->
  <rect x="304" y="120" width="192" height="34" rx="4" fill="none" stroke="#1e71d6" stroke-width="1.5"/>
  <text x="400" y="142" text-anchor="middle" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">antigravity.yaml</text>

  <rect x="304" y="164" width="90" height="36" rx="4" fill="none" stroke="#495f7a" stroke-width="1.5"/>
  <text x="349" y="186" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="11">.antigravity/</text>

  <rect x="406" y="164" width="90" height="36" rx="4" fill="none" stroke="#495f7a" stroke-width="1.5"/>
  <text x="451" y="186" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="11">src/ + tests/</text>

  <text x="400" y="232" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="12">Context graph + AST indexer</text>

  <!-- Forward Prompt Stream and Reverse Diff Stream to Gemini -->
  <path d="M 514 116 L 598 116" fill="none" stroke="#1e71d6" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="556" y="106" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">context</text>

  <path d="M 598 184 L 514 184" fill="none" stroke="#bd35c2" stroke-width="3" marker-end="url(#arrow-magenta)"/>
  <text x="556" y="204" text-anchor="middle" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">patches</text>

  <!-- Right: Gemini Model Endpoints -->
  <rect x="606" y="54" width="170" height="192" rx="10" fill="#082445"/>
  <text x="691" y="86" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Gemini API</text>

  <rect x="624" y="104" width="134" height="52" rx="6" fill="#1e71d6"/>
  <text x="691" y="126" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">gemini-2.5-pro</text>
  <text x="691" y="144" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" opacity="0.9">Deep reasoning</text>

  <rect x="624" y="170" width="134" height="52" rx="6" fill="#6a55e4"/>
  <text x="691" y="192" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">gemini-2.5-flash</text>
  <text x="691" y="210" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" opacity="0.9">Fast iteration</text>
</svg>
