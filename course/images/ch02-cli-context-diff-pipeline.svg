<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-label="Target file AST imports are extracted and pruned against excluded paths to assemble a compact context payload, producing structured diff patches that pass verification before writing to disk">
  <defs>
    <linearGradient id="payload-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e71d6"/>
      <stop offset="0.5" stop-color="#6a55e4"/>
      <stop offset="1" stop-color="#bd35c2"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e71d6"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6a55e4"/>
    </marker>
    <marker id="arr-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#bd35c2"/>
    </marker>
  </defs>

  <!-- 1. Left: Local Repo Tree and AST Import Graph -->
  <rect x="20" y="24" width="184" height="220" rx="8" fill="none" stroke="#082445" stroke-width="2"/>
  <text x="34" y="48" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">AST Import Graph</text>

  <!-- Selected target node -->
  <rect x="34" y="64" width="156" height="32" rx="4" fill="#082445"/>
  <text x="44" y="84" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">src/orders/handler.ts</text>

  <!-- Imported dependency nodes (included) -->
  <line x1="52" y1="96" x2="52" y2="118" stroke="#1e71d6" stroke-width="2"/>
  <line x1="52" y1="118" x2="66" y2="118" stroke="#1e71d6" stroke-width="2"/>
  <rect x="66" y="104" width="124" height="28" rx="4" fill="none" stroke="#1e71d6" stroke-width="1.5"/>
  <text x="76" y="122" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="11">src/types/order.ts</text>

  <line x1="52" y1="118" x2="52" y2="156" stroke="#1e71d6" stroke-width="2"/>
  <line x1="52" y1="156" x2="66" y2="156" stroke="#1e71d6" stroke-width="2"/>
  <rect x="66" y="142" width="124" height="28" rx="4" fill="none" stroke="#1e71d6" stroke-width="1.5"/>
  <text x="76" y="160" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="11">src/db/client.ts</text>

  <!-- Pruned / excluded nodes -->
  <rect x="34" y="188" width="156" height="40" rx="4" fill="none" stroke="#495f7a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="44" y="206" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="10">node_modules/ , dist/</text>
  <text x="44" y="220" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="10">pruned by exclude globs</text>

  <!-- Arrow 1 -->
  <path d="M 204 128 L 254 128" fill="none" stroke="#1e71d6" stroke-width="2.5" marker-end="url(#arr-b)"/>

  <!-- 2. Center-Left: Pruned Token Payload -->
  <rect x="262" y="42" width="160" height="184" rx="8" fill="#082445"/>
  <text x="342" y="66" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Context Payload</text>

  <!-- Stacked token slices showing proportional budget -->
  <rect x="278" y="80" width="128" height="26" rx="4" fill="#1e71d6"/>
  <text x="342" y="97" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11">Prompt + Schema</text>

  <rect x="278" y="114" width="128" height="44" rx="4" fill="url(#payload-band)"/>
  <text x="342" y="134" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">AST Signatures</text>
  <text x="342" y="149" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" opacity="0.9">4.2k / 32k tokens</text>

  <rect x="278" y="166" width="128" height="44" rx="4" fill="#6a55e4"/>
  <text x="342" y="186" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">gemini-2.5-flash</text>
  <text x="342" y="201" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" opacity="0.9">Streaming response</text>

  <!-- Arrow 2 -->
  <path d="M 422 128 L 472 128" fill="none" stroke="#6a55e4" stroke-width="2.5" marker-end="url(#arr-p)"/>

  <!-- 3. Center-Right: Unified Diff Hunks -->
  <rect x="480" y="34" width="166" height="200" rx="8" fill="none" stroke="#6a55e4" stroke-width="2"/>
  <text x="494" y="56" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Unified Diff Patch</text>

  <!-- Diff lines representation -->
  <rect x="494" y="70" width="138" height="20" rx="3" fill="#495f7a" opacity="0.15"/>
  <text x="502" y="84" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="10">@@ -14,4 +14,8 @@</text>

  <rect x="494" y="96" width="138" height="22" rx="3" fill="#bd35c2" opacity="0.18"/>
  <text x="502" y="111" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">- return rawOrder;</text>

  <rect x="494" y="124" width="138" height="22" rx="3" fill="#1e71d6" opacity="0.18"/>
  <text x="502" y="139" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">+ const valid = parse()</text>

  <rect x="494" y="152" width="138" height="22" rx="3" fill="#1e71d6" opacity="0.18"/>
  <text x="502" y="167" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">+ return valid.data;</text>

  <text x="563" y="212" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="11">--dry-run / --apply</text>

  <!-- Arrow 3 -->
  <path d="M 646 128 L 688 128" fill="none" stroke="#bd35c2" stroke-width="2.5" marker-end="url(#arr-m)"/>

  <!-- 4. Right: Verification Gate & Working Tree -->
  <rect x="696" y="54" width="88" height="160" rx="8" fill="#082445"/>
  <text x="740" y="82" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">--verify</text>
  <rect x="710" y="96" width="60" height="26" rx="4" fill="#1e71d6"/>
  <text x="740" y="113" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10">npm test</text>
  <rect x="710" y="134" width="60" height="58" rx="4" fill="#bd35c2"/>
  <text x="740" y="158" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Write or</text>
  <text x="740" y="174" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Rollback</text>
</svg>
