<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-label="Repository directory tree showing proportional token footprint of six candidate paths against a 32k token budget line">
  <defs>
    <linearGradient id="bloat-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a55e4"/>
      <stop offset="1" stop-color="#bd35c2"/>
    </linearGradient>
  </defs>

  <!-- Outer frame representing unpruned repository scan -->
  <rect x="16" y="20" width="388" height="380" rx="10" fill="none" stroke="#082445" stroke-width="2.5"/>
  <rect x="16" y="20" width="388" height="34" rx="8" fill="#082445"/>
  <text x="32" y="42" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">order-service/ (unpruned scan)</text>
  <text x="388" y="42" text-anchor="end" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">token footprint</text>

  <!-- 32k Token Budget Reference Line -->
  <line x1="212" y1="66" x2="212" y2="354" stroke="#1e71d6" stroke-width="1.8" stroke-dasharray="5 4"/>
  <rect x="158" y="358" width="108" height="22" rx="4" fill="#082445"/>
  <text x="212" y="373" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">32k max_tokens</text>

  <!-- Row 1: .git/ -->
  <text x="34" y="96" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">.git/</text>
  <rect x="138" y="80" width="110" height="22" rx="4" fill="#495f7a"/>
  <text x="256" y="95" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">28.0k tok</text>

  <!-- Row 2: node_modules/ (massive bloater overflowing budget line) -->
  <text x="34" y="144" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">node_modules/</text>
  <rect x="138" y="128" width="244" height="24" rx="4" fill="url(#bloat-bar)"/>
  <text x="374" y="144" text-anchor="end" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">184.0k tok (overflow)</text>

  <!-- Row 3: dist/ -->
  <text x="34" y="192" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">dist/</text>
  <rect x="138" y="176" width="142" height="22" rx="4" fill="#6a55e4"/>
  <text x="288" y="191" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">42.5k tok</text>

  <!-- Row 4: .env.local -->
  <text x="34" y="240" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">.env.local</text>
  <rect x="138" y="224" width="16" height="22" rx="3" fill="#bd35c2"/>
  <rect x="162" y="224" width="118" height="22" rx="4" fill="none" stroke="#bd35c2" stroke-width="1.5"/>
  <text x="221" y="239" text-anchor="middle" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">API_KEY + DB_URL</text>

  <!-- Row 5: src/ -->
  <text x="34" y="288" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">src/</text>
  <rect x="138" y="272" width="44" height="22" rx="4" fill="#1e71d6"/>
  <text x="190" y="287" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">3.1k tok (types + logic)</text>

  <!-- Row 6: tests/ -->
  <text x="34" y="336" fill="#1c1d1f" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">tests/</text>
  <rect x="138" y="320" width="26" height="22" rx="4" fill="#082445"/>
  <text x="172" y="335" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">1.4k tok (specs)</text>
</svg>
